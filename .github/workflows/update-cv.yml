name: Update CV from Zotero

on:
  # Run weekly on Sundays at 2 AM UTC
  schedule:
    - cron: '0 2 * * 0'
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Run on push to main (but not if commit message contains [skip-cv-update])
  push:
    branches: [ main ]

jobs:
  update-cv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Skip if the commit message contains [skip-cv-update]
    if: "!contains(github.event.head_commit.message, '[skip-cv-update]')"
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        python-version: '3.11'

    - name: Install pandoc
      run: sudo apt-get install -y pandoc

    - name: Run CV refresh script
      env:
        ZOTERO_LIBRARY_ID: ${{ secrets.ZOTERO_LIBRARY_ID }}
        ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        ZOTERO_PUBLICATIONS_COLLECTION: ${{ secrets.ZOTERO_PUBLICATIONS_COLLECTION }}
        ZOTERO_CONFERENCE_COLLECTION: ${{ secrets.ZOTERO_CONFERENCE_COLLECTION }}
      run: uv run python build/refresh_cv.py

    - name: Build pages
      run: uv run python build/build.py

    - name: Check for changes
      id: check_changes
      run: |
        # Check YAML for changes beyond just the date field
        YAML_DIFF=$(git diff cv/John_Ragland_CV.yaml | grep "^[+-]" | grep -v "^[+-][+-][+-]" | grep -v "^\(+\|-\)  *date:" | wc -l | tr -d ' ')
        # Check HTML for any changes
        HTML_DIFF=$(git diff --quiet cv.html index.html projects.html || echo "1")
        if [ "$YAML_DIFF" -gt 0 ] || [ "$HTML_DIFF" = "1" ]; then
          echo "changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push if changes
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"-cv-update
        git add cv/John_Ragland_CV.yaml cv/rendercv_output/ cv.html John_Ragland_CV.pdf index.html projects.html
        git commit -m "chore: Auto-update CV from Zotero [skip ci]"
        git push