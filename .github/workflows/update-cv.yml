name: Build and deploy site

on:
  # Refresh the CV from Zotero weekly on Sundays at 2 AM UTC
  schedule:
    - cron: '0 2 * * 0'

  # Allow manual trigger
  workflow_dispatch:

  # Rebuild and deploy on every push to main
  push:
    branches: [ main ]

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer deploy supersede an in-flight one, but never cancel a running deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        python-version: '3.12'

    - name: Install pandoc
      run: sudo apt-get install -y pandoc

    - name: Run CV refresh script
      env:
        ZOTERO_LIBRARY_ID: ${{ secrets.ZOTERO_LIBRARY_ID }}
        ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        ZOTERO_PUBLICATIONS_COLLECTION: ${{ secrets.ZOTERO_PUBLICATIONS_COLLECTION }}
        ZOTERO_CONFERENCE_COLLECTION: ${{ secrets.ZOTERO_CONFERENCE_COLLECTION }}
      run: uv run python build/refresh_cv.py

    - name: Build pages
      run: uv run python build/build.py

    - name: Stage site
      run: uv run python build/stage_site.py

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
